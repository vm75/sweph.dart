name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sibling packages
        run: |
          git clone --depth 1 https://github.com/vm75/universal_ffi.git ../universal_ffi
          git clone --depth 1 https://github.com/vm75/wasm_ffi.git ../wasm_ffi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install root dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed lib/src/wasm_asset_saver.dart lib/sweph.dart example/lib example/test tool

      - name: Run analyzer
        run: flutter analyze

      - name: Run root unit tests
        run: flutter test

      - name: Install example dependencies
        run: |
          cd example
          flutter pub get

      - name: Run example tests
        run: |
          cd example
          SWEPH_DYLIB_PATH=$PWD/../example.dart/libsweph.so flutter test

      - name: Build Flutter Web (dart2js)
        run: |
          cd example
          flutter build web

      - name: Build Flutter Web with Wasm (dart2wasm)
        run: |
          cd example
          flutter build web --wasm

      - name: Verify publish dry run
        run: dart pub publish --dry-run
