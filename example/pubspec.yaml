name: sweph_example
description: Demonstrates how to use the sweph plugin.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  sweph:
    path: ../
  cupertino_icons: ^1.0.2
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  universal_ffi:
    path: ../../universal_ffi
  wasm_ffi:
    path: ../../wasm_ffi


flutter:
  uses-material-design: true

  assets:
    - assets/ephe/seorbel.txt